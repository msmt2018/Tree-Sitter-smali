name: Fuzz Parser

on:
  push:
    paths:
      - src/scanner.c
  pull_request:
    paths:
      - src/scanner.c
  workflow_dispatch: # 支持手动触发

jobs:
  fuzz:
    name: Parser Fuzzing (Official)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js (For tree-sitter tools)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Tree-sitter CLI
        run: npm install -g tree-sitter-cli

      - name: Run Fuzz Test
        run: |
          npx tree-sitter test
